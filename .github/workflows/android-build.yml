name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --project-name football_analyzer .
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build small release APKs (one per CPU type)
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --dart-define=PREDICTION_API_URL=${{ vars.PREDICTION_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: football-ai-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
